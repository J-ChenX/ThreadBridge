[package]
name = "threadbridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Self-hosted bridge for viewing and continuing Codex conversations on Android"
license = "MIT"
repository = "https://github.com/J-ChenX/ThreadBridge"
readme = "../../README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["limit"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
