name: 功能建议
description: 说明使用场景和希望改善的行为
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 当前遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 希望用户如何操作、得到什么结果？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充说明（可选）
