name: Release APK

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag matching android/release.properties
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate stable version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check tag and download the recorded published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_version=$(python3 scripts/release_policy.py --field versionName)
          [[ "$RELEASE_TAG" == "v$candidate_version" ]] || { echo 'Tag does not match the candidate version source' >&2; exit 1; }
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          releases = json.loads((Path(os.environ["RUNNER_TEMP"]) / "releases.json").read_text())
          if any(release["tag_name"] == os.environ["RELEASE_TAG"] for release in releases):
              raise SystemExit("Release already exists; refusing to replace published assets")
          PYCODE
          previous_version=$(python3 scripts/release_policy.py --field publishedVersionName)
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "v$previous_version" --pattern "ThreadBridge-$previous_version.apk" --dir "$RUNNER_TEMP/previous" || {
            echo 'The exact recorded published APK must be available on GitHub Releases; no older baseline is allowed' >&2
            exit 1
          }
          printf 'PREVIOUS_APK=%s/previous/ThreadBridge-%s.apk\n' "$RUNNER_TEMP" "$previous_version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify the actual published baseline
        run: python3 scripts/verify-release.py --preflight --previous "$PREVIOUS_APK" --sdk "$ANDROID_HOME"
      - name: Restore the original signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.THREADBRIDGE_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.THREADBRIDGE_KEY_PASSWORD }}
          SIGNER_SHA256: ${{ secrets.THREADBRIDGE_SIGNER_SHA256 }}
        run: |
          : "${KEYSTORE_BASE64:?Missing keystore secret}"
          : "${KEY_PASSWORD:?Missing signing password secret}"
          : "${SIGNER_SHA256:?Missing original certificate fingerprint}"
          expected_signer=$(python3 scripts/release_policy.py --field signerSha256)
          [[ "${SIGNER_SHA256,,}" == "$expected_signer" ]] || { echo 'Signing certificate secret differs from the version source' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/threadbridge.jks"
      - name: Test, lint and build the public signed APK
        env:
          THREADBRIDGE_KEYSTORE: ${{ runner.temp }}/threadbridge.jks
          THREADBRIDGE_KEY_PASSWORD: ${{ secrets.THREADBRIDGE_KEY_PASSWORD }}
          THREADBRIDGE_PUBLIC_TEST_SERVER: ''
          THREADBRIDGE_PUBLIC_TEST_PREVIOUS_SERVER: ''
          THREADBRIDGE_PUBLIC_TEST_HOST: ''
        run: scripts/build-apk.sh "$PREVIOUS_APK"
      - name: Verify the delivery bundle
        run: |
          set -euo pipefail
          apk_name=$(python3 scripts/release_policy.py --field artifactName)
          apk="artifacts/$apk_name"
          python3 scripts/verify-release.py "$apk" --previous "$PREVIOUS_APK" --sdk "$ANDROID_HOME"
          (cd artifacts && sha256sum --check "$apk_name.sha256")
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts.release_policy import artifact_name, load_policy
          policy = load_policy()
          apk = Path("artifacts") / artifact_name(policy)
          report = json.loads(apk.with_suffix(".verification.json").read_text())
          if report.get("delivery_approved") is not True or report.get("upgrade_identity_verified") is not True:
              raise SystemExit("Delivery verification report is not approved")
          PYCODE
      - name: Publish APK, checksum and verification report to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          apk_name=$(python3 scripts/release_policy.py --field artifactName)
          apk="artifacts/$apk_name"
          report="${apk%.apk}.verification.json"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          下载附件 APK，在 Android 8.0 及以上设备安装。已有版本可直接覆盖升级。

          公开安装包不预置个人服务器地址，请配对自己的 ThreadBridge Hub。电脑端也需使用匹配版本；安装 APK 不会升级电脑服务。

          本安装包经 JVM 测试、Release Lint、签名、16 KiB 对齐及版本检查。SHA-256 校验文件和批准交付的验证报告与 APK 一同提供。
          EOF
          gh release create "$RELEASE_TAG" "$apk" "$apk.sha256" "$report" --verify-tag --generate-notes \
            --title "ThreadBridge $version" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/threadbridge.jks"
